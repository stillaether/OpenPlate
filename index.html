<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>OpenPlate — Open Source Meal Planner</title>
  <meta name="description" content="A fully open-source, privacy-first meal planner. Plan meals, build smart grocery lists, cook with what you have, and waste less. No accounts. No paywalls.">
  <meta name="theme-color" content="#2E7D3C">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-64.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <header id="topbar" role="banner"></header>
    <main id="view" role="main"></main>

    <nav id="bottomnav" aria-label="Main navigation">
      <button class="tab" data-tab="plan" data-action="nav" data-nav="#/plan" aria-label="Meal Plan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 9h18M8 14h3M8 17h6"/></svg>
        <span>Plan</span><i class="nav-badge" aria-hidden="true"></i>
      </button>
      <button class="tab" data-tab="groceries" data-action="nav" data-nav="#/groceries" aria-label="Groceries">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h16l-1.2 12a2 2 0 0 1-2 1.8H7.2a2 2 0 0 1-2-1.8L4 8Z"/><path d="M8.5 8V6a3.5 3.5 0 0 1 7 0v2"/></svg>
        <span>Groceries</span><i class="nav-badge" aria-hidden="true"></i>
      </button>
      <button class="tab" data-tab="recipes" data-action="nav" data-nav="#/recipes" aria-label="Recipes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 3v7a3 3 0 0 0 3 3v8M7 3v4M10 3v4M17 3c-1.5 1.5-2 4-2 6.5 0 1.5 1 2.5 2 2.5V21M17 3c1.5 1.5 2 4 2 6.5 0 1.5-1 2.5-2 2.5"/></svg>
        <span>Recipes</span><i class="nav-badge" aria-hidden="true"></i>
      </button>
      <button class="tab" data-tab="settings" data-action="nav" data-nav="#/settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.01a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55h.01a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.01a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1Z"/></svg>
        <span>Settings</span><i class="nav-badge" aria-hidden="true"></i>
      </button>
    </nav>

    <div id="modal-root"></div>
    <div id="cook-root"></div>
    <div id="toasts" aria-live="polite"></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
